spring:
  application:
    name: facade-cli

  main:
    banner-mode: console

  output:
    ansi:
      enabled: always

  docker:
    compose:
      file: compose.yaml
      enabled: false

  shell:
    command:
      clear:
        enabled: false
      history:
        enabled: false
      script:
        enabled: false
      version:
        enabled: false

logging:
  file:
    name: facade-cli-application.log

  level:
    root: info
    org.sasanlabs: debug

  threshold:
    console: "off"

  include-application-name: true

  logback:
    rollingpolicy:
      file-name-pattern: facade-cli-application.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
      clean-history-on-start: true

vapp:
  base:
    url: http://localhost:80
